      align-items: center;

      padding: 20px;
      color: #fff;

      letter-spacing: 2px;

      margin-bottom: 16px;

      height: 260px;

      color: #facc15;
      margin-bottom: 8px;

      font-size: 12px;
      color: #38bdf8;
      font-family: monospace;
      word-break: break-all;

      color: #fff;
      border: none;
      padding: 10px 20px;

      font-weight: 600;
      cursor: pointer;
